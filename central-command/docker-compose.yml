version: "3.9"

services:
  cc-db:
    image: postgres:16
    environment:
      POSTGRES_USER: cc_app
      POSTGRES_PASSWORD: cc_dev_local
      POSTGRES_DB: central_command
    ports:
      - "5433:5432"
    volumes:
      - cc_pgdata:/var/lib/postgresql/data

  cc-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    environment:
      DATABASE_URL: postgresql+psycopg://cc_app:cc_dev_local@cc-db:5432/central_command
    depends_on:
      - cc-db

  cc-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5174:80"
    depends_on:
      - cc-backend

volumes:
  cc_pgdata:
