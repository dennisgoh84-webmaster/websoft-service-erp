<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Websoft Incidents</title>
  <!-- Microsoft's own CDN for Office.js -- required for any Office Add-in,
       not something this project hosts itself. -->
  <script type="text/javascript" src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <style>
    body {
      font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      margin: 0;
      padding: 16px;
      color: #2a2a2a;
      background: #fff;
    }
    h1 { font-size: 15px; margin: 0 0 12px; color: #7a2340; }
    .card { border: 1px solid #e2e2e2; border-radius: 6px; padding: 12px; margin-bottom: 12px; }
    .muted { color: #777; font-size: 12px; }
    label { display: block; font-size: 12px; color: #555; margin: 8px 0 4px; }
    input { width: 100%; box-sizing: border-box; padding: 6px 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; }
    button {
      display: block; width: 100%; margin-top: 10px; padding: 8px;
      background: #7a2340; color: #fff; border: none; border-radius: 4px;
      font-size: 13px; cursor: pointer;
    }
    button.secondary { background: #fff; color: #7a2340; border: 1px solid #7a2340; }
    button:disabled { opacity: 0.6; cursor: default; }
    .error { color: #b3261e; font-size: 12px; margin-top: 8px; }
    .success { color: #1a7f37; font-size: 12px; margin-top: 8px; }
    #app-panel, #result-panel { display: none; }
  </style>
</head>
<body>
  <h1>Websoft Incidents</h1>

  <!-- First run only: this add-in calls this app's own login (the same
       email/password every staff member already has), not Azure AD SSO
       -- see README.md for why. The token is kept only in this
       taskpane's sessionStorage, never written anywhere else. -->
  <div class="card" id="login-panel">
    <p class="muted">Sign in once per Outlook session.</p>
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="username" />
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password" />
    <button id="login-button">Sign in</button>
    <div class="error" id="login-error"></div>
  </div>

  <div id="app-panel">
    <div class="card">
      <div class="muted" id="email-summary"></div>
    </div>
    <button id="convert-incident-button">Log as Incident</button>
    <button id="convert-job-order-button" class="secondary">Convert to Job Order</button>
    <div class="error" id="action-error"></div>
  </div>

  <div class="card" id="result-panel">
    <div id="result-text"></div>
  </div>

  <script src="taskpane.js"></script>
</body>
</html>
